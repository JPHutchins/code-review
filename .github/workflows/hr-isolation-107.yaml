# TEMPORARY #107 diagnostic — delete after the experiment concludes.
# Isolates whether harden-runner's `egress-policy: block` is what makes a long-running review runner
# receive a "shutdown signal". Two arms, 8 reps each: `block` arms the same egress lock the review job
# uses (idle, no agent, no untrusted code); `noblock` arms nothing. Each idles 20 min with a memory
# sampler. If block arms get "received a shutdown signal" and noblock arms don't, the block mechanism
# is the cause. Dispatch: gh workflow run hr-isolation-107.yaml --ref main
name: hr-isolation-107

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  idle:
    strategy:
      fail-fast: false
      matrix:
        policy: [block, noblock]
        rep: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    steps:
      - name: Lock network egress (block arm only)
        if: ${{ matrix.policy == 'block' }}
        uses: JPHutchins/harden-runner@ee143ec9798e02c7b6f70d1bb39864121a71345d # same pin the review job uses
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org:443
            api.deepseek.com:443
            api.anthropic.com:443
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.actions.githubusercontent.com:443

      - name: Idle 20 minutes with a memory sampler
        run: |
          set -euo pipefail
          echo "arm=${{ matrix.policy }}-${{ matrix.rep }} start"
          ( while true; do
              echo "mem $(date -u +%T) $(free -m | awk '/^Mem:/{printf "used=%sMi avail=%sMi",$3,$7}')"
              sleep 20
            done ) &
          sleep 1200
          echo "arm=${{ matrix.policy }}-${{ matrix.rep }} survived 20m"
