# #107 evidence probe — GitHub hosted-runner reclamation ("received a shutdown signal").
# Runs every 15 min; each 20-min job overlaps the next, so coverage is ~gapless (the old 2-hourly
# probe sampled only ~17% of wall-clock and so could not be compared to the near-continuous review
# stream — a sparse probe sails through the reclamation bursts a dense stream catches). Five arms,
# one job each per run, testing TWO hypotheses at matched times:
#
#   Hypothesis 1 — GitHub reclaims a VM it thinks is "locked up": no console output since X AND
#   CPU under Y. This is an AND, so it needs the full 2x2 minus the trivially-fine cell:
#     silent  — sleep only: NO output, idle CPU        -> both conditions met -> should reclaim
#     idle    — sleep + mem sampler every 20s: OUTPUT, idle CPU  -> output breaks it -> survive
#     busycpu — sleep + all cores pegged, output to /dev/null: NO output, BUSY CPU -> CPU breaks it -> survive
#   If silent reclaims while idle AND busycpu survive, the locked-up AND-heuristic is confirmed and
#   the fix is trivial (peg a core or emit a heartbeat during a review's silent API-waits).
#
#   Hypothesis 2 — harden-runner egress-block severs the runner control plane (idle has output+idle
#   CPU, so H1 predicts it survives; the harden arms add only harden-runner on top of idle):
#     hardenaudit — idle + harden-runner egress-policy: audit (present, NOT enforcing)
#     hardenblock — idle + harden-runner egress-policy: block (the exact lock reviews use)
#   If hardenblock reclaims while idle+hardenaudit survive, egress ENFORCEMENT is the cause; if
#   hardenaudit reclaims too, harden-runner's presence; if neither, harden-runner is cleared.
#
# A reclaimed job dies red ("received a shutdown signal") and GitHub auto-retries (run_attempt++).
name: runner-reclamation-probe

on:
  schedule:
    - cron: "6,21,36,51 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        mode: [silent, idle, busycpu, hardenaudit, hardenblock]
    runs-on: ubuntu-latest
    steps:
      - name: harden-runner (hardenaudit / hardenblock arms only)
        if: ${{ startsWith(matrix.mode, 'harden') }}
        uses: JPHutchins/harden-runner@ee143ec9798e02c7b6f70d1bb39864121a71345d # same pin the review job uses
        with:
          egress-policy: ${{ matrix.mode == 'hardenblock' && 'block' || 'audit' }}
          allowed-endpoints: >
            registry.npmjs.org:443
            api.deepseek.com:443
            api.anthropic.com:443
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.actions.githubusercontent.com:443

      - name: Occupy a runner for 20 minutes (${{ matrix.mode }})
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          echo "mode=${MODE} start ($(nproc) cpus)"
          # silent and busycpu emit NOTHING after this line; the rest stream a mem sample every 20s.
          if [ "$MODE" != "silent" ] && [ "$MODE" != "busycpu" ]; then
            ( while true; do
                echo "mem $(date -u +%T) $(free -m | awk '/^Mem:/{printf "used=%sMi avail=%sMi",$3,$7}')"
                sleep 20
              done ) &
          fi
          # busycpu pegs every core with self-terminating `yes`, output discarded so it stays silent.
          if [ "$MODE" = "busycpu" ]; then
            for _ in $(seq 1 "$(nproc)"); do timeout 1200 yes >/dev/null & done
          fi
          sleep 1200
          echo "mode=${MODE} survived 20m"
