# #107 evidence probe — GitHub hosted-runner reclamation ("received a shutdown signal").
# Runs every 2h. Two arms × 3 reps, each occupying a runner for 20 min:
#   idle — just sleeps (the control; ~44% of these were reclaimed in the one-off matrix)
#   busy — pegs every core with `yes` the whole time (never looks idle to GitHub)
# A reclaimed job dies red with "received a shutdown signal"; the run history is the evidence.
# Comparing idle-vs-busy reclamation over time answers two questions: (1) is the reclamation
# transient (rate falls) or persistent, and (2) does keeping the runner BUSY avoid it — i.e. would
# a CPU keepalive during a review's quiet stretches (agent waiting on the API) prevent the kill.
# harden-runner is deliberately ABSENT here: the matrix already showed the kill is independent of it.
name: runner-reclamation-probe

on:
  schedule:
    - cron: "13 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        mode: [idle, busy]
        rep: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - name: Occupy a runner for 20 minutes (${{ matrix.mode }})
        env:
          MODE: ${{ matrix.mode }}
          REP: ${{ matrix.rep }}
        run: |
          set -euo pipefail
          echo "mode=${MODE}-${REP} start ($(nproc) cpus)"
          # Memory sampler (orphaned; the runner reaps it when the step ends) — confirms it is never OOM.
          ( while true; do
              echo "mem $(date -u +%T) $(free -m | awk '/^Mem:/{printf "used=%sMi avail=%sMi",$3,$7}')"
              sleep 20
            done ) &
          # The busy arm pegs every core with self-terminating `yes` loops so the runner never idles.
          if [ "$MODE" = "busy" ]; then
            for _ in $(seq 1 "$(nproc)"); do timeout 1200 yes >/dev/null & done
          fi
          sleep 1200
          echo "mode=${MODE}-${REP} survived 20m"
