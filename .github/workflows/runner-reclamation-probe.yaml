# #107 evidence probe — GitHub hosted-runner reclamation ("received a shutdown signal").
# Runs every 2h. Three arms × 3 reps, each occupying a runner for 20 min:
#   silent — pure `sleep 1200`, ZERO console output for 20 min (the true control; reproduces the
#            one-off matrix that reclaimed ~44%). Tests: does GitHub cull a runner that goes quiet?
#   idle   — `sleep 1200` + a background sampler that echoes memory every 20s. Same non-work as
#            silent, but the stream of console output means it is NOT silent.
#   busy   — idle's sampler PLUS every core pegged with `yes`, so it exercises CPU-not-idle too.
# A reclaimed job dies red with "received a shutdown signal"; the run history is the evidence.
# The decisive contrast is silent-vs-idle IN THE SAME RUN (time-controlled): if silent reclaims
# while idle survives, then console output is a heartbeat that prevents reclamation — which would
# explain why real reviews reclaim (the agent goes silent for minutes while blocked on the API) and
# make a periodic-echo keepalive during those quiet stretches the fix. busy separates CPU from output.
# harden-runner is deliberately ABSENT here: this isolates the silence axis, nothing else.
name: runner-reclamation-probe

on:
  schedule:
    - cron: "13 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        mode: [silent, idle, busy]
        rep: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - name: Occupy a runner for 20 minutes (${{ matrix.mode }})
        env:
          MODE: ${{ matrix.mode }}
          REP: ${{ matrix.rep }}
        run: |
          set -euo pipefail
          echo "mode=${MODE}-${REP} start ($(nproc) cpus)"
          # silent emits nothing after this line; idle/busy stream a mem sample every 20s (= not silent).
          if [ "$MODE" != "silent" ]; then
            ( while true; do
                echo "mem $(date -u +%T) $(free -m | awk '/^Mem:/{printf "used=%sMi avail=%sMi",$3,$7}')"
                sleep 20
              done ) &
          fi
          # busy pegs every core with self-terminating `yes` loops on top of the sampler output.
          if [ "$MODE" = "busy" ]; then
            for _ in $(seq 1 "$(nproc)"); do timeout 1200 yes >/dev/null & done
          fi
          sleep 1200
          echo "mode=${MODE}-${REP} survived 20m"
